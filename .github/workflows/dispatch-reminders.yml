# Fires due reminders, overdue alerts and calendar alerts on the live site.
# Vercel's free plan only allows daily crons, so GitHub Actions calls the
# dispatcher instead. GitHub runs schedules at most every 5 minutes (and can
# be a few minutes late under load), so reminders arrive within ~5 minutes.
name: Dispatch reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: dispatch-reminders
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call /api/cron/dispatch
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: https://daybook-livid-one.vercel.app
        run: |
          curl --fail-with-body -sS --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/dispatch"
